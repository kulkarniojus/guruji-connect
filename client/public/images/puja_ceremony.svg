<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9d6c1" />
      <stop offset="100%" stop-color="#f9a85f" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGradient)" />
  
  <!-- Decorative border -->
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#8b4513" stroke-width="10" stroke-dasharray="15,5" />
  
  <!-- Altar with flowers -->
  <rect x="200" y="250" width="400" height="150" fill="#8b4513" rx="10" />
  <rect x="220" y="230" width="360" height="30" fill="#a0522d" rx="5" />
  
  <!-- Deity image -->
  <rect x="340" y="120" width="120" height="160" fill="#ffd700" />
  <circle cx="400" cy="160" r="40" fill="#ffdb58" stroke="#ff8c00" stroke-width="3" />
  <path d="M385,185 C390,200 410,200 415,185" fill="none" stroke="#8b4513" stroke-width="2" />
  
  <!-- Incense holders -->
  <rect x="280" y="270" width="30" height="20" fill="#cd853f" />
  <line x1="295" y1="270" x2="295" y2="250" stroke="#000" stroke-width="2" />
  <path d="M295,250 C295,245 290,240 295,235" stroke="#000" stroke-width="1" />
  <circle cx="295" cy="233" r="2" fill="#ff4500" />
  
  <rect x="490" y="270" width="30" height="20" fill="#cd853f" />
  <line x1="505" y1="270" x2="505" y2="250" stroke="#000" stroke-width="2" />
  <path d="M505,250 C505,245 500,240 505,235" stroke="#000" stroke-width="1" />
  <circle cx="505" cy="233" r="2" fill="#ff4500" />
  
  <!-- Offerings -->
  <ellipse cx="350" cy="300" rx="30" ry="15" fill="#ff8c00" />
  <ellipse cx="450" cy="300" rx="30" ry="15" fill="#ffff00" />
  
  <!-- Oil lamp (diya) -->
  <path d="M400,280 C390,280 385,290 400,300 C415,290 410,280 400,280" fill="#cd7f32" />
  <ellipse cx="400" cy="290" rx="5" ry="3" fill="#ff4500" />
  
  <!-- Flowers -->
  <circle cx="330" cy="350" r="10" fill="#ff69b4" />
  <circle cx="350" cy="350" r="10" fill="#ff1493" />
  <circle cx="450" cy="350" r="10" fill="#9370db" />
  <circle cx="470" cy="350" r="10" fill="#8a2be2" />
  
  <!-- People in prayer -->
  <ellipse cx="300" cy="450" rx="40" ry="20" fill="#8b4513" />
  <circle cx="300" cy="390" r="25" fill="#d2b48c" />
  <path d="M290,385 Q300,395 310,385" fill="none" stroke="#000" stroke-width="1" />
  <circle cx="290" cy="380" r="3" fill="#000" />
  <circle cx="310" cy="380" r="3" fill="#000" />
  
  <ellipse cx="500" cy="450" rx="40" ry="20" fill="#8b4513" />
  <circle cx="500" cy="390" r="25" fill="#d2b48c" />
  <path d="M490,385 Q500,395 510,385" fill="none" stroke="#000" stroke-width="1" />
  <circle cx="490" cy="380" r="3" fill="#000" />
  <circle cx="510" cy="380" r="3" fill="#000" />
  
  <!-- Priest figure -->
  <ellipse cx="400" cy="450" rx="50" ry="25" fill="#b8860b" />
  <circle cx="400" cy="380" r="30" fill="#d2b48c" />
  <path d="M385,380 Q400,390 415,380" fill="none" stroke="#000" stroke-width="1" />
  <circle cx="385" cy="375" r="3" fill="#000" />
  <circle cx="415" cy="375" r="3" fill="#000" />
  <rect x="370" y="410" width="60" height="10" fill="#ff8c00" />
  
  <!-- Hand gestures -->
  <circle cx="350" cy="410" r="15" fill="#d2b48c" />
  <circle cx="450" cy="410" r="15" fill="#d2b48c" />
  
  <!-- Title of the ceremony -->
  <text x="400" y="50" font-family="Arial" font-size="30" font-weight="bold" text-anchor="middle" fill="#8b4513">Traditional Puja Ceremony</text>
  <text x="400" y="80" font-family="Arial" font-size="16" text-anchor="middle" fill="#8b4513">A Sacred Hindu Ritual</text>
</svg>
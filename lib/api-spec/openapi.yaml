openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /settings/payment:
    get:
      operationId: getPaymentConfiguration
      responses:
        "200":
          description: Public payment configuration, never credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentConfiguration" }
  /admin/settings/payment:
    put:
      operationId: savePaymentConfiguration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentConfigurationInput" }
      responses:
        "200":
          description: Admin payment configuration saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentConfiguration" }
  /payments/checkout:
    post:
      operationId: startBookingCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentCheckoutInput" }
      responses:
        "200":
          description: Checkout URL or existing paid booking; no payment is assumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutStartResult" }
  /payments/checkout/{sessionId}:
    get:
      operationId: verifyBookingCheckout
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Owner-only server-verified payment outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentCheckoutResult" }
  /payments/orders/{orderId}:
    get:
      operationId: getBookingPaymentOrder
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Owner-only attempt summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentOrderSummary" }
  /admin/payments/checkouts:
    get:
      operationId: listAdminBookingCheckouts
      responses:
        "200":
          description: Latest 100 checkout attempts; actual collections are in Customer Activity and Guruji Finance
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminCheckoutRecord" }
  /admin/payments/checkouts/{orderId}/reconcile:
    post:
      operationId: reconcileBookingCheckout
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Rechecked with Stripe; never initiates a charge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentCheckoutResult" }
  /admin/customers/{customerId}/activity:
    get:
      operationId: getCustomerActivity
      summary: Admin-only customer booking, cancellation and manual finance history
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Real recorded activity; balances are not automatic money transfers
          content:
            application/json:
              schema:
                type: object
                required: [customer, summary, bookings, entries, cancellationEvents]
                properties:
                  customer: { type: object, additionalProperties: true }
                  summary: { type: object, additionalProperties: { type: number } }
                  bookings: { type: array, items: { type: object, additionalProperties: true } }
                  entries: { type: array, items: { type: object, additionalProperties: true } }
                  cancellationEvents: { type: array, items: { type: object, additionalProperties: true } }
        "403": { description: Admin access required }
  /admin/customers/{customerId}/finance:
    post:
      operationId: recordCustomerFinance
      summary: Record an actual manual payment/refund or documented financial adjustment
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerFinanceEntryInput"
      responses:
        "201":
          description: Audited record saved; no money moved by the server
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        "409": { description: "Duplicate record, over-refund, stale balance or closed booking" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    PaymentConfigurationInput:
      type: object
      required: [paymentRequired, advancePercentage]
      properties:
        paymentRequired: { type: boolean }
        advancePercentage: { type: number, minimum: 1, maximum: 100, multipleOf: 0.01 }
        upiId: { type: [string, "null"] }
        upiName: { type: [string, "null"] }
        upiQrImageUrl: { type: [string, "null"] }
    PaymentConfiguration:
      allOf:
        - { $ref: "#/components/schemas/PaymentConfigurationInput" }
        - type: object
          required: [checkoutAvailable, providerMode, paymentSkipped]
          properties:
            checkoutAvailable: { type: boolean }
            provider: { type: string }
            providerMode: { type: string, enum: [test, live, unavailable] }
            paymentSkipped: { type: boolean }
    CheckoutBooking:
      type: object
      required: [pujaId, type, amount, date, time]
      properties:
        pujaId: { type: integer, minimum: 1 }
        type: { type: string, enum: [offline, online] }
        amount: { type: number, exclusiveMinimum: 0 }
        withSamagri: { type: boolean }
        date: { type: string }
        calendarDate: { type: string }
        time: { type: string }
        address: { type: string }
        city: { type: string }
        state: { type: string }
        pincode: { type: string }
        gurujiId: { type: integer, minimum: 1 }
        duration: { type: number }
        notes: { type: string }
        isImmediate: { type: boolean }
        consultationType: { type: string, enum: [own_guruji, auto_select, immediate] }
    PaymentCheckoutInput:
      type: object
      required: [booking, requestId]
      properties:
        booking: { $ref: "#/components/schemas/CheckoutBooking" }
        requestId: { type: string, format: uuid }
    CheckoutStartResult:
      type: object
      properties:
        checkoutUrl: { type: string }
        orderId: { type: string }
        sessionId: { type: string }
        bookingId: { type: integer }
        advanceAmount: { type: number }
    PaymentCheckoutResult:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [paid, expired, processing, unpaid, failed] }
        bookingId: { type: integer }
        advanceAmount: { type: number }
        needsSupport: { type: boolean }
        testMode: { type: boolean }
    PaymentOrderSummary:
      type: object
      required: [state, sessionId, bookingId]
      properties:
        state: { type: string }
        sessionId: { type: [string, "null"] }
        bookingId: { type: [integer, "null"] }
    AdminCheckoutRecord:
      type: object
      required: [id, customerId, customerName, state, advanceAmount, advancePercentage, totalAmount, createdAt, livemode]
      properties:
        id: { type: string }
        customerId: { type: integer }
        customerName: { type: string }
        state: { type: string }
        bookingId: { type: [integer, "null"] }
        needsSupport: { type: boolean }
        advanceAmount: { type: number }
        advancePercentage: { type: number }
        totalAmount: { type: number }
        createdAt: { type: string }
        livemode: { type: boolean }
        paymentReference: { type: [string, "null"] }
        sessionId: { type: [string, "null"] }
    CustomerFinanceEntryInput:
      type: object
      required: [bookingId, type, amount, reason]
      properties:
        bookingId: { type: integer, minimum: 1 }
        type: { type: string, enum: [payment, refund, additional_charge, credit] }
        amount: { type: number, exclusiveMinimum: 0, maximum: 100000000, multipleOf: 0.01 }
        reason: { type: string, minLength: 5, maxLength: 2000 }
        reference: { type: string, maxLength: 200 }
        paidBy: { type: string, enum: [portal, guruji], default: portal }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status


openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /reviews/featured:
    get:
      operationId: listFeaturedCustomerReviews
      summary: List recent written customer reviews from completed bookings
      responses:
        "200":
          description: Recent public customer reviews; customer identity is not included
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FeaturedCustomerReview" }
  /events:
    get:
      operationId: listEvents
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: Published events
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EventRecord" } }
  /events/{eventId}:
    get:
      operationId: getEvent
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Event details; private online joining details require registration or admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRecord" }
  /events/{eventId}/register:
    post:
      operationId: registerForEvent
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventRegistrationInput" }
      responses:
        "201":
          description: Child registration or temporary checkout seat reservation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRegistration" }
  /event-registrations:
    get:
      operationId: listMyEventRegistrations
      responses:
        "200":
          description: Current guardian's registrations
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EventRegistration" } }
  /customer/refunds:
    get:
      operationId: listCustomerRefunds
      responses:
        "200":
          description: Refund progress for the signed-in customer
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CustomerRefundProgress" } }
  /event-registrations/{registrationId}/checkout:
    post:
      operationId: startEventCheckout
      parameters:
        - { name: registrationId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Verified hosted checkout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventCheckoutResult" }
  /event-registrations/{registrationId}/reconcile:
    post:
      operationId: reconcileEventCheckout
      parameters:
        - { name: registrationId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Server-verified payment state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRegistration" }
  /event-registrations/{registrationId}/cancel:
    post:
      operationId: cancelEventRegistration
      parameters:
        - { name: registrationId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventReasonInput" }
      responses:
        "200":
          description: Cancelled registration and refund owed, without an automatic money transfer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRegistration" }
  /admin/events:
    get:
      operationId: listAdminEvents
      responses:
        "200":
          description: All event states
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EventRecord" } }
    post:
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "201":
          description: Created draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRecord" }
  /admin/events/{eventId}:
    put:
      operationId: updateEvent
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "200":
          description: Edited or rescheduled; existing participants notified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRecord" }
  /admin/events/{eventId}/action:
    post:
      operationId: changeEventStatus
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventActionInput" }
      responses:
        "200":
          description: Published, unpublished or cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRecord" }
  /admin/events/{eventId}/participants:
    get:
      operationId: listEventParticipants
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Private event bookings and payment history
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EventRegistration" } }
  /admin/event-registrations/{registrationId}/payments:
    post:
      operationId: recordEventPayment
      parameters:
        - { name: registrationId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventPaymentInput" }
      responses:
        "200":
          description: Audited manual payment or refund
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRegistration" }
  /admin/event-registrations/{registrationId}/confirm:
    post:
      operationId: confirmManualEventRegistration
      parameters:
        - { name: registrationId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Manually confirmed event registration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRegistration" }
  /admin/events/{eventId}/attendance/{sessionId}:
    get:
      operationId: getEventAttendance
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: integer } }
        - { name: sessionId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Session attendance
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EventAttendance" } }
  /admin/events/{eventId}/attendance:
    post:
      operationId: saveEventAttendance
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventAttendanceInput" }
      responses:
        "200":
          description: Attendance saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventAttendance" }
  /admin/events/{eventId}/notify:
    post:
      operationId: notifyEventParticipants
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventMessageInput" }
      responses:
        "200":
          description: Parents notified in-app
          content:
            application/json:
              schema:
                type: object
                required: [notified]
                properties:
                  notified: { type: integer }
  /admin/event-media:
    post:
      operationId: requestEventMediaUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventMediaUploadInput" }
      responses:
        "200":
          description: Direct App Storage upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventMediaUploadResult" }
  /admin/event-media/complete:
    post:
      operationId: completeEventMediaUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventMediaCompleteInput" }
      responses:
        "200":
          description: Validated event media
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventMediaItem" }
  /bookings/{bookingId}/samagri:
    get:
      operationId: getBookingSamagri
      parameters:
        - { name: bookingId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Saved samagri list, visible only to its customer or admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingSamagri"
  /admin/bookings/{bookingId}/samagri/resend:
    post:
      operationId: resendBookingSamagri
      parameters:
        - { name: bookingId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Customer notified in-app; WhatsApp remains unavailable until connected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingSamagri" }
  /samagri/uploads:
    post:
      operationId: requestSamagriUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SamagriUploadInput" }
      responses:
        "200":
          description: Admin-only direct image upload
          content:
            application/json:
              schema:
                type: object
                required: [uploadURL, imageUrl]
                properties:
                  uploadURL: { type: string }
                  imageUrl: { type: string }
  /samagri/uploads/complete:
    post:
      operationId: completeSamagriUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SamagriPhotoInput" }
      responses:
        "200":
          description: Validated uploaded image
          content:
            application/json:
              schema:
                type: object
                required: [imageUrl]
                properties:
                  imageUrl: { type: string }
  /mobile/push:
    put:
      operationId: registerGurujiPushDevice
      description: Guruji session only. Called inside the first-party native WebView to retain HttpOnly session authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GurujiPushDeviceInput" }
      responses:
        "200":
          description: Device registered for new puja requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushDeviceResult" }
    delete:
      operationId: disableGurujiPushDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GurujiPushDisableInput" }
      responses:
        "200":
          description: This session's device disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushDeviceResult" }
  /settings/payment:
    get:
      operationId: getPaymentConfiguration
      responses:
        "200":
          description: Public payment configuration, never credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentConfiguration" }
  /admin/settings/payment:
    put:
      operationId: savePaymentConfiguration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentConfigurationInput" }
      responses:
        "200":
          description: Admin payment configuration saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentConfiguration" }
  /payments/checkout:
    post:
      operationId: startBookingCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentCheckoutInput" }
      responses:
        "200":
          description: Checkout URL or existing paid booking; no payment is assumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutStartResult" }
  /payments/checkout/{sessionId}:
    get:
      operationId: verifyBookingCheckout
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Owner-only server-verified payment outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentCheckoutResult" }
  /payments/orders/{orderId}:
    get:
      operationId: getBookingPaymentOrder
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Owner-only attempt summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentOrderSummary" }
  /admin/payments/checkouts:
    get:
      operationId: listAdminBookingCheckouts
      responses:
        "200":
          description: Latest 100 checkout attempts; actual collections are in Customer Activity and Guruji Finance
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminCheckoutRecord" }
  /admin/payments/checkouts/{orderId}/reconcile:
    post:
      operationId: reconcileBookingCheckout
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Rechecked with Stripe; never initiates a charge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentCheckoutResult" }
  /admin/customers/{customerId}/activity:
    get:
      operationId: getCustomerActivity
      summary: Admin-only customer booking, cancellation and manual finance history
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Real recorded activity; balances are not automatic money transfers
          content:
            application/json:
              schema:
                type: object
                required: [customer, summary, bookings, entries, cancellationEvents]
                properties:
                  customer: { type: object, additionalProperties: true }
                  summary: { type: object, additionalProperties: { type: number } }
                  bookings: { type: array, items: { type: object, additionalProperties: true } }
                  entries: { type: array, items: { type: object, additionalProperties: true } }
                  cancellationEvents: { type: array, items: { type: object, additionalProperties: true } }
        "403": { description: Admin access required }
  /admin/customers/{customerId}/finance:
    post:
      operationId: recordCustomerFinance
      summary: Record an actual manual payment/refund or documented financial adjustment
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerFinanceEntryInput"
      responses:
        "201":
          description: Audited record saved; no money moved by the server
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        "409": { description: "Duplicate record, over-refund, stale balance or closed booking" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    FeaturedCustomerReview:
      type: object
      required: [id, rating, review, createdAt]
      properties:
        id: { type: integer }
        rating: { type: integer, minimum: 1, maximum: 5 }
        review: { type: string }
        pujaName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    EventInput:
      type: object
      required: [name, description, classType, ageMin, ageMax, instructorName, instructorDetails, mode, city, state, location, meetingUrl, startDate, endDate, startTime, durationMinutes, frequency, weekdays, basePrice, discountedPrice, registrationDeadline, capacity, paymentMode, media]
      properties:
        name: { type: string }
        description: { type: string }
        classType: { type: string }
        ageMin: { type: integer }
        ageMax: { type: integer }
        instructorName: { type: string }
        instructorDetails: { type: string }
        mode: { type: string, enum: [online, offline] }
        city: { type: string }
        state: { type: string }
        location: { type: string }
        meetingUrl: { type: string }
        startDate: { type: string }
        endDate: { type: string }
        startTime: { type: string }
        durationMinutes: { type: integer }
        frequency: { type: string, enum: [once, daily, weekly] }
        weekdays: { type: array, items: { type: integer } }
        basePrice: { type: number }
        discountedPrice: { type: [number, "null"] }
        registrationDeadline: { type: string, description: ISO timestamp with timezone }
        capacity: { type: integer }
        paymentMode: { type: string, enum: [online, manual, both] }
        media: { type: array, items: { $ref: "#/components/schemas/EventMediaItem" } }
    EventRecord:
      allOf:
        - { $ref: "#/components/schemas/EventInput" }
        - type: object
          required: [id, status, version, availableSeats, currentPrice, registrationOpen, checkoutAvailable, checkoutMode, sessions]
          properties:
            id: { type: integer }
            status: { type: string, enum: [draft, published, cancelled] }
            version: { type: integer }
            availableSeats: { type: integer }
            currentPrice: { type: number }
            registrationOpen: { type: boolean }
            checkoutAvailable: { type: boolean }
            checkoutMode: { type: string }
            cancellationReason: { type: string }
            sessions: { type: array, items: { $ref: "#/components/schemas/EventSession" } }
    EventMediaItem:
      type: object
      required: [url, kind, label]
      properties:
        url: { type: string }
        kind: { type: string, enum: [banner, photo, video, document] }
        label: { type: string }
    EventSession:
      type: object
      required: [id, startAt, endAt, status]
      properties:
        id: { type: integer }
        startAt: { type: string }
        endAt: { type: string }
        status: { type: string, enum: [pending_payment, pending_confirmation, registered, expired, cancelled] }
    EventRegistrationInput:
      type: object
      required: [requestId, childName, childAge, guardianConsent, paymentMethod, eventVersion]
      properties:
        requestId: { type: string }
        childName: { type: string }
        childAge: { type: integer }
        guardianConsent: { type: boolean }
        paymentMethod: { type: string, enum: [online, manual] }
        eventVersion: { type: integer }
    EventRegistration:
      type: object
      required: [id, eventId, eventName, guardianName, childName, childAge, status, paymentMethod, fee, paid, refunded, balanceDue, refundDue, isTest, createdAt, payments]
      properties:
        id: { type: string }
        eventId: { type: integer }
        eventName: { type: string }
        guardianName: { type: string }
        childName: { type: string }
        childAge: { type: integer }
        status: { type: string }
        paymentMethod: { type: string }
        fee: { type: number }
        paid: { type: number }
        refunded: { type: number }
        balanceDue: { type: number }
        refundDue: { type: number }
        isTest: { type: boolean }
        holdUntil: { type: [string, "null"] }
        cancellationReason: { type: string }
        createdAt: { type: string }
        payments: { type: array, items: { $ref: "#/components/schemas/EventPaymentRecord" } }
    CustomerRefundProgress:
      type: object
      required: [bookingId, eventRegistrationId, status, sourceKind, stripeAmount, manualAmount, manualReference]
      properties:
        bookingId: { type: [integer, "null"] }
        eventRegistrationId: { type: [string, "null"] }
        status: { type: string, enum: [pending, processing, manual_pending, paid, failed] }
        sourceKind: { type: string, enum: [stripe, manual, mixed] }
        stripeAmount: { type: number }
        manualAmount: { type: number }
        manualReference: { type: [string, "null"] }
    EventPaymentRecord:
      type: object
      required: [type, amount, reference, createdAt]
      properties:
        type: { type: string }
        amount: { type: number }
        reference: { type: string }
        createdAt: { type: string }
    EventReasonInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    EventActionInput:
      type: object
      required: [action, reason]
      properties:
        action: { type: string, enum: [publish, unpublish, cancel] }
        reason: { type: string }
    EventPaymentInput:
      type: object
      required: [type, amount, reference, note]
      properties:
        type: { type: string, enum: [payment, refund] }
        amount: { type: number }
        reference: { type: string }
        note: { type: string }
    EventAttendanceInput:
      type: object
      required: [sessionId, registrationId, status]
      properties:
        sessionId: { type: integer }
        registrationId: { type: string }
        status: { type: string, enum: [present, absent, excused] }
    EventAttendance:
      allOf:
        - { $ref: "#/components/schemas/EventAttendanceInput" }
        - type: object
          required: [recordedAt]
          properties:
            recordedAt: { type: string }
    EventMessageInput:
      type: object
      required: [message]
      properties:
        message: { type: string }
    EventCheckoutResult:
      type: object
      required: [url, mode]
      properties:
        url: { type: string }
        mode: { type: string }
    EventMediaUploadInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string }
        size: { type: integer }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp, video/mp4, application/pdf] }
    EventMediaUploadResult:
      type: object
      required: [uploadURL, url]
      properties:
        uploadURL: { type: string }
        url: { type: string }
    EventMediaCompleteInput:
      allOf:
        - { $ref: "#/components/schemas/EventMediaItem" }
    SamagriUploadInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string }
        size: { type: integer }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
    SamagriPhotoInput:
      type: object
      required: [imageUrl]
      properties:
        imageUrl: { type: string }
    SamagriItem:
      type: object
      required: [name, quantity, optional, price]
      properties:
        name: { type: string }
        quantity: { type: number }
        optional: { type: boolean }
        price: { type: number }
        unit: { type: string }
        imageUrl: { type: string }
    BookingSamagri:
      type: object
      required: [bookingId, pujaName, items, whatsappStatus, whatsappReason, history]
      properties:
        bookingId: { type: integer }
        pujaName: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/SamagriItem" }
        whatsappStatus: { type: string }
        whatsappReason: { type: string }
        history:
          type: array
          items:
            type: object
            required: [channel, status, createdAt]
            properties:
              channel: { type: string }
              status: { type: string }
              createdAt: { type: string }
    GurujiPushDeviceInput:
      type: object
      required: [installationId, token, platform, projectId, accountId]
      properties:
        installationId: { type: string, minLength: 20, maxLength: 100 }
        token: { type: string, maxLength: 250 }
        platform: { type: string, enum: [android, ios] }
        projectId: { type: string, format: uuid }
        accountId: { type: integer, minimum: 1, description: Must match the authenticated Guruji; prevents account-switch races. }
    GurujiPushDisableInput:
      type: object
      required: [installationId]
      properties:
        installationId: { type: string, minLength: 20, maxLength: 100 }
    PushDeviceResult:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    PaymentConfigurationInput:
      type: object
      required: [paymentRequired, advancePercentage]
      properties:
        paymentRequired: { type: boolean }
        advancePercentage: { type: number, minimum: 1, maximum: 100, multipleOf: 0.01 }
        upiId: { type: [string, "null"] }
        upiName: { type: [string, "null"] }
        upiQrImageUrl: { type: [string, "null"] }
    PaymentConfiguration:
      allOf:
        - { $ref: "#/components/schemas/PaymentConfigurationInput" }
        - type: object
          required: [checkoutAvailable, providerMode, paymentSkipped]
          properties:
            checkoutAvailable: { type: boolean }
            provider: { type: string }
            providerMode: { type: string, enum: [test, live, unavailable] }
            paymentSkipped: { type: boolean }
    CheckoutBooking:
      type: object
      required: [pujaId, type, amount, date, time]
      properties:
        pujaId: { type: integer, minimum: 1 }
        type: { type: string, enum: [offline, online] }
        amount: { type: number, exclusiveMinimum: 0 }
        withSamagri: { type: boolean }
        date: { type: string }
